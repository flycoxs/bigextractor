version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  web:
    build: .
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
  worker:
    build: .
    volumes:
      - ./:/app
    command: ["rq", "worker", "--url", "redis://redis:6379/0"]
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
